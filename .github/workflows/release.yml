# DISABLED ON PURPOSE (FACTORY-620 / GitHub #615, superseded by FACTORY-627):
# there is no npm publisher set up for @brooswit/butchr, so the old `publish`
# job's npm step 404'd on every push to main. Brooswit decided: no npm
# publishing for now — she will clone the repos; releases are a git tag plus
# a GitHub Release only. This workflow was disabled via `gh workflow disable
# release` (FACTORY-601, state `disabled_manually`).
#
# FACTORY-627 rewrote this to "option B": the version is computed from the
# latest `v*` tag plus the highest `changelog.d/` fragment bump since it
# (scripts/release/release.ts) — NOT from `package.json` or a collate+commit
# step. There is no commit to `main` at all now (so branch protection,
# `enforce_admins`/required checks, is never touched by this workflow), no
# `package.json` or `CHANGELOG.md` edit, and `changelog.d/` fragments are
# never deleted (they simply stop counting once a tag is made past them —
# see `scripts/release/git.ts`'s `fragmentsAddedSince`). This workflow STAYS
# DISABLED until the director re-enables it (proven by
# `scripts/release/release.ts --dry-run`, exercised on every PR by
# `ci.yml`'s `release-gate` job) — do not re-enable it as part of reviewing
# or merging this change.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write   # tag + GitHub Release only — no commit/push to main, no npm
concurrency:
  group: release-main
  cancel-in-progress: false   # never cancel a merge's release — a second merge's own fragments must always be computed from THIS merge's new tag, not a torn-down intermediate state
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: sync onto the current origin/main
        # cancel-in-progress:false serializes this workflow with itself — a second merge's run
        # does not even START (checkout included) until this one finishes — but `checkout` pins
        # github.sha, the exact commit that triggered THIS run, which can already be stale by the
        # time the job actually executes (runner queueing, or another merge landing during it).
        # Reset onto whatever origin/main actually is right now so the tag we compute from, and
        # the fragments since it, are never a stale snapshot. scripts/release/release.ts reads
        # HEAD, never GITHUB_SHA, for exactly this reason.
        run: git fetch origin main && git reset --hard origin/main
      - name: identity for the annotated release tag (no commit ever made or pushed with it)
        run: git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: compute + tag + GitHub Release (no commit, no npm — see header)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bun run scripts/release/release.ts
