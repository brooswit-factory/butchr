name: ci
on:
  pull_request:
  # A new org gates pull_request-triggered runs (they queue with zero jobs), so
  # CI also runs on any pushed branch and can be dispatched by hand.
  push:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: butchr
    steps:
      - uses: actions/checkout@v4
        with: { path: butchr }
      - uses: actions/checkout@v4
        with:
          repository: brooswit-factory/drovr
          ref: 52d0106898982cb4d411208dc687f9e20a4075eb
          path: drovr
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - name: build pinned sibling SDK sources
        working-directory: drovr
        shell: bash
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          cd legacy-events
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - run: bun install --frozen-lockfile
      - name: load tests up to date
        run: bun run generate && bun run scripts/verify-generated-is-committed.ts
      - run: bun run typecheck
      - name: unit + load tests, coverage ≥ 90%
        run: >
          mkdir -p test-results &&
          bun test test/unit test/load --reporter=junit --reporter-outfile=test-results/junit.xml &&
          bun run scripts/coverage/gate.ts
      - name: upload test report (always, even on failure — FACTORY-179)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: butchr/test-results/junit.xml
          if-no-files-found: ignore
      - run: bun run build
  spawn-smoke:
    name: spawn smoke (FACTORY-892)
    # Starts a REAL agent through a REAL herdr with butchr's REAL kickoff
    # argv — the one thing test/unit (which only inspects the array
    # spawnArgs() returns, never hands it to herdr) cannot catch: herdr
    # itself rejecting a start argument it can't shell-quote
    # (invalid_agent_argument), which is exactly how FACTORY-735/739 broke
    # every spawn in production. See scripts/verify-ci-spawn-smoke.ts.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: butchr
    env:
      # FACTORY-891 review: the smoke test's own "did the stub actually
      # run" proof — see scripts/ci-fixtures/claude. Set at JOB level so
      # both the `herdr server` process (whose env every pane it spawns
      # inherits) and the verify script agree on the same path.
      BUTCHR_CI_SPAWN_SMOKE_SENTINEL: /tmp/butchr-ci-spawn-smoke-claude.ran
    steps:
      - uses: actions/checkout@v4
        with: { path: butchr }
      - uses: actions/checkout@v4
        with:
          repository: brooswit-factory/drovr
          ref: 52d0106898982cb4d411208dc687f9e20a4075eb
          path: drovr
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - name: build pinned sibling SDK sources
        working-directory: drovr
        shell: bash
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          cd legacy-events
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - run: bun install --frozen-lockfile
      - name: install herdr 0.8.2 (pinned — the verified CLI surface per docs/agent-providers.md; same binary docs/getting-started.md points operators at, from herdrdev/herdr's own GitHub release)
        run: |
          curl -fsSL -o /usr/local/bin/herdr https://github.com/herdrdev/herdr/releases/download/v0.8.2/herdr-linux-x86_64
          chmod +x /usr/local/bin/herdr
          herdr --version
      - name: "install the stub 'claude' (CI has no Claude account; see scripts/ci-fixtures/claude's own doc comment). Installed to /usr/local/bin, same as herdr above — a pane's own shell may not inherit a PATH only exported to this step. No --version check here — the stub ignores all args and just sleeps, so that would hang this step."
        run: install -m 0755 scripts/ci-fixtures/claude /usr/local/bin/claude
      - name: start herdr server
        run: |
          herdr server > herdr-server.log 2>&1 &
          for i in $(seq 1 30); do herdr api snapshot >/dev/null 2>&1 && exit 0; sleep 1; done
          echo "herdr server never became ready:"; cat herdr-server.log; exit 1
      - name: run the real spawn smoke test
        run: bun run scripts/verify-ci-spawn-smoke.ts
      - name: stop herdr server
        if: always()
        run: herdr server stop || true
  windows:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: butchr
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { path: butchr }
      - uses: actions/checkout@v4
        with:
          repository: brooswit-factory/drovr
          ref: 52d0106898982cb4d411208dc687f9e20a4075eb
          path: drovr
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - name: build pinned sibling SDK sources
        working-directory: drovr
        shell: bash
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          cd legacy-events
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - run: bun install --frozen-lockfile
      - name: typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: unit + load tests, coverage ≥ 90%
        continue-on-error: true
        run: bun test test/unit test/load && bun run scripts/coverage/gate.ts
  windows-deployment-identity:
    name: windows deployment identity (FACTORY-1043 required gate)
    # The `windows` job above is whole-suite and continue-on-error (it tracks the full
    # cross-platform gap, not a pass/fail release gate) and never starts the real daemon,
    # so it cannot fail the check on a regression in the ONE thing FACTORY-1043 is about:
    # the real daemon reaching app.listen() on Windows, and a restart reusing the existing
    # deployment identity. This job is neither whole-suite nor continue-on-error — it is
    # REQUIRED, and scoped to exactly that path. See scripts/verify-ci-windows-deployment-identity.ts
    # for what it actually proves and why it never touches a real herdr/Jira/GitHub account.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: butchr
    steps:
      - uses: actions/checkout@v4
        with: { path: butchr }
      - uses: actions/checkout@v4
        with:
          repository: brooswit-factory/drovr
          ref: 52d0106898982cb4d411208dc687f9e20a4075eb
          path: drovr
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - name: build pinned sibling SDK sources
        working-directory: drovr
        shell: bash
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          cd legacy-events
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - run: bun install --frozen-lockfile
      - name: focused unit coverage for the deployment-identity/control-panel durability fix (FACTORY-1043)
        run: bun test test/unit/control-panel-https.test.ts test/unit/control-panel-https-telemetry.test.ts test/unit/control-panel-deployment-identity.test.ts test/unit/control-panel-writer-durable-write.test.ts test/unit/control-panel-writer-sync-directory.test.ts test/unit/control-panel-writer-group-other-bits.test.ts test/unit/control-panel-windows-acl.test.ts test/unit/control-panel-rule-runtime.test.ts test/unit/control-panel-operational-inventory.test.ts test/unit/deployment-preflight.test.ts test/unit/write-rules.test.ts
      - name: real daemon fresh startup reaches HTTP listen, then restart reuses the SAME deployment identity (and a separate install gets a DISTINCT one)
        run: bun run scripts/verify-ci-windows-deployment-identity.ts
  release-gate:
    name: release gate
    # Runs on pull requests AND branch pushes: with a pull_request-only `if`, a branch pushed
    # without a PR reported this required check as SKIPPED (FACTORY-626).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: butchr
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, path: butchr }
      - uses: actions/checkout@v4
        with:
          repository: brooswit-factory/drovr
          ref: 52d0106898982cb4d411208dc687f9e20a4075eb
          path: drovr
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.11 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: build pinned sibling SDK sources
        working-directory: drovr
        shell: bash
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          cd legacy-events
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - run: bun install --frozen-lockfile
      - run: bun run scripts/release/check.ts
        env: { RELEASE_BASE: "origin/${{ github.base_ref || 'main' }}" }
      - name: release dry-run (informational, not required — what the next release would compute to from this PR's own diff; see scripts/release/release.ts)
        continue-on-error: true
        run: bun run scripts/release/release.ts --dry-run
